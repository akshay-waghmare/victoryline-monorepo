# Docker Compose for LOCAL testing with Caddy
# Uses Caddyfile.local (HTTP only, no HTTPS)
# Builds images locally instead of pulling from registry

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./apps/backend/spring-security-jwt
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: "8099"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SCRAPER_HYDRATE_URL: http://scraper:5000/hydrate-match-details
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      GSC_ENABLED: "false"
      CRAWLER_PLAYER_STATS_ENABLED: "true"
    depends_on:
      - redis
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8099/api/v1/seo/indexing/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scraper:
    build:
      context: ./apps/scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Backend API Configuration
      BACKEND_URL: http://backend:8099
      TOKEN_URL: http://backend:8099/token/generate-token
      SERVICE_URL: http://backend:8099/cricket-data
      ADD_LIVE_MATCHES_URL: http://backend:8099/cricket-data/add-live-matches
      SYNC_SCHEDULE_MATCHES_URL: http://backend:8099/cricket-data/sync-schedule-matches
      API_ENDPOINT: http://backend:8099/cricket-data/match-info/save
      API_ENDPOINT_SC4: http://backend:8099/cricket-data/sC4-stats/save
      PLAYER_STATS_API_ENDPOINT: http://backend:8099/crawler/player-stats/ingest
      # Redis Configuration  
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Scraper Configuration
      FLASK_ENV: development
      FLASK_DEBUG: "0"
      ENABLE_PROMETHEUS_METRICS: "true"
      POLLING_INTERVAL_SECONDS: "0.8"
      STALENESS_THRESHOLD_SECONDS: "60"
      ENABLE_PERSISTENT_PAGES: "true"
      PERSISTENT_PAGE_MAX_COUNT: "30"
      FAST_POLL_RECONCILE_INTERVAL_SECONDS: "0.8"
      LIVE_MATCH_RESCRAPE_INTERVAL_SECONDS: "8"
      # PID limits - persistent pages create 2x browser contexts (discovery + fast-poll pages per match)
      # With 5 matches + 2 player stats workers, stable PID count is ~450-550
      PID_SOFT_LIMIT: "500"
      PID_RESTART_THRESHOLD: "650"
      ENABLE_PLAYER_STATS_CRAWLER: "true"
      PLAYER_STATS_INCLUDE_LIVE_MATCHES: "true"
      PLAYER_STATS_INCLUDE_UPCOMING_MATCHES: "false"
      PLAYER_STATS_POLLING_INTERVAL_SECONDS: "30"
      PLAYER_STATS_LIVE_COOLDOWN_SECONDS: "30"
      PLAYER_STATS_UPCOMING_COOLDOWN_SECONDS: "120"
      PLAYER_STATS_WORKER_COUNT: "2"
    volumes:
      - scraper_data:/app/storage
    depends_on:
      - backend
      - redis
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prerender:
    build:
      context: ./apps/frontend
      dockerfile: prerender-sidecar/Dockerfile
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      BACKEND_URL: http://backend:8099
      PRERENDER_OUT_DIR: /shared-html/prerender
    volumes:
      - prerender_html:/shared-html
    depends_on:
      - backend
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - prerender_html:/shared-html
    environment:
      API_URL: http://backend:8099
    entrypoint: ["/bin/sh", "-c", "rm -rf /usr/share/nginx/html/prerender && ln -sf /shared-html/prerender /usr/share/nginx/html/prerender && nginx -g 'daemon off;'"]
    depends_on:
      - backend
      - prerender
      - scraper
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "8080:80"
    volumes:
      # Use LOCAL Caddyfile for HTTP-only testing
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - victoryline-network

networks:
  victoryline-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  prerender_html:
    driver: local
  scraper_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
