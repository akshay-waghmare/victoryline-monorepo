  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
  #     MYSQL_DATABASE: "${MYSQL_DATABASE:-cricket_db}"
  #     MYSQL_USER: "${MYSQL_USER:-cricket_user}"
  #     MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
  #   ports:
  #     - "${MYSQL_PORT:-3306}:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - victoryline-network
  #   healthcheck:
  #     test:
  #       - CMD
  #       - mysqladmin
  #       - ping
  #       - -h
  #       - localhost
  #       - -u
  #       - root
  #       - "-p${MYSQL_ROOT_PASSWORD}"
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: victoryline-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: "${BACKEND_IMAGE:-macubex/victoryline-backend:v1.2.2}"
    container_name: victoryline-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8099}:8099"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      # Using H2 embedded database for production
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:h2:file:/app/data/victoryline;DB_CLOSE_ON_EXIT=FALSE}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.h2.Driver}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-sa}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-}"
      SPRING_JPA_DATABASE_PLATFORM: "${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.H2Dialect}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"
      SPRING_JPA_SHOW_SQL: "${SHOW_SQL:-false}"
      SPRING_H2_CONSOLE_ENABLED: "${SPRING_H2_CONSOLE_ENABLED:-true}"
      SPRING_H2_CONSOLE_PATH: "${SPRING_H2_CONSOLE_PATH:-/h2-console}"
      JWT_SECRET: "${JWT_SECRET:-change_me}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-86400}"
      SCRAPER_HYDRATE_URL: "${SCRAPER_HYDRATE_URL:-http://scraper:5000/hydrate-match-details}"
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Google Search Console / Indexing API settings
      GSC_ENABLED: "${GSC_ENABLED:-true}"
      GSC_SITE_URL: "${GSC_SITE_URL:-https://www.crickzen.com/}"
      GSC_SITEMAP_URL: "${GSC_SITEMAP_URL:-https://www.crickzen.com/sitemap.xml}"
      GSC_SERVICE_ACCOUNT_PATH: "${GSC_SERVICE_ACCOUNT_PATH:-file:/app/config/gsc-service-account.json}"
      # Google credentials - also supports GOOGLE_APPLICATION_CREDENTIALS env var
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/app/config/gsc-service-account.json}"
      # Live Match Indexing Scheduler settings
      INDEXING_SCHEDULER_ENABLED: "${INDEXING_SCHEDULER_ENABLED:-true}"
      INDEXING_SCHEDULER_INTERVAL_MS: "${INDEXING_SCHEDULER_INTERVAL_MS:-900000}"
      INDEXING_MAX_PER_RUN: "${INDEXING_MAX_PER_RUN:-10}"
      # RapidAPI for cricket news
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
    volumes:
      - backend_data:/app/data
      # Mount GSC service account file - create empty file if not using GSC
      # To disable: touch gsc-service-account.json && set GSC_ENABLED=false
      - ${GSC_SERVICE_ACCOUNT_FILE:-./gsc-service-account.json}:/app/config/gsc-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - victoryline-network
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s http://localhost:8099/ > /dev/null || exit 0"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  scraper:
    image: "${SCRAPER_IMAGE:-macubex/victoryline-scraper:v1.2.2}"
    container_name: victoryline-scraper
    restart: unless-stopped
    ports:
      - "${SCRAPER_PORT:-5000}:5000"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://backend:8099}"
      TOKEN_URL: "${TOKEN_URL:-http://backend:8099/token/generate-token}"
      SERVICE_URL: "${SERVICE_URL:-http://backend:8099/cricket-data}"
      ADD_LIVE_MATCHES_URL: "${ADD_LIVE_MATCHES_URL:-http://backend:8099/cricket-data/add-live-matches}"
      SYNC_SCHEDULE_MATCHES_URL: "${SYNC_SCHEDULE_MATCHES_URL:-http://backend:8099/cricket-data/sync-schedule-matches}"
      API_ENDPOINT: "${API_ENDPOINT:-http://backend:8099/cricket-data/match-info/save}"
      API_ENDPOINT_SC4: "${API_ENDPOINT_SC4:-http://backend:8099/cricket-data/sC4-stats/save}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      FLASK_ENV: "${FLASK_ENV:-production}"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      PLAYWRIGHT_HEADLESS: "${PLAYWRIGHT_HEADLESS:-true}"
      SCRAPER_MAX_LIFETIME_HOURS: "${SCRAPER_MAX_LIFETIME_HOURS:-6}"
      MEMORY_SOFT_LIMIT_MB: "${MEMORY_SOFT_LIMIT_MB:-1536}"
      MEMORY_HARD_LIMIT_MB: "${MEMORY_HARD_LIMIT_MB:-2048}"
      POLLING_INTERVAL_SECONDS: "${POLLING_INTERVAL_SECONDS:-0.8}"
      POLLING_MIN_SECONDS: "${POLLING_MIN_SECONDS:-2}"
      POLLING_BREAK_SECONDS: "${POLLING_BREAK_SECONDS:-30}"
      PAGE_TIMEOUT_SECONDS: "${PAGE_TIMEOUT_SECONDS:-30}"
      ENABLE_PROMETHEUS_METRICS: "${ENABLE_PROMETHEUS_METRICS:-true}"
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-9090}"
      ENABLE_FAST_UPDATES: "${ENABLE_FAST_UPDATES:-false}"
      STALENESS_THRESHOLD_SECONDS: "${STALENESS_THRESHOLD_SECONDS:-180}"
      PID_SOFT_LIMIT: "${PID_SOFT_LIMIT:-360}"
      PID_RESTART_THRESHOLD: "${PID_RESTART_THRESHOLD:-500}"
      ORPHAN_CLEANUP_INTERVAL_SECONDS: "${ORPHAN_CLEANUP_INTERVAL_SECONDS:-120}"
      ENABLE_PERSISTENT_PAGES: "${ENABLE_PERSISTENT_PAGES:-false}"
      PERSISTENT_PAGE_MAX_COUNT: "${PERSISTENT_PAGE_MAX_COUNT:-30}"
      PERSISTENT_PAGE_MAX_AGE_SECONDS: "${PERSISTENT_PAGE_MAX_AGE_SECONDS:-7200}"
      FAST_POLL_INTERVAL_MS: "${FAST_POLL_INTERVAL_MS:-1000}"
      FAST_POLL_RECONCILE_INTERVAL_SECONDS: "${FAST_POLL_RECONCILE_INTERVAL_SECONDS:-0.8}"
      LIVE_MATCH_RESCRAPE_INTERVAL_SECONDS: "${LIVE_MATCH_RESCRAPE_INTERVAL_SECONDS:-15}"
      ENABLE_PLAYER_STATS_CRAWLER: "${ENABLE_PLAYER_STATS_CRAWLER:-false}"
      PLAYER_STATS_INCLUDE_LIVE_MATCHES: "${PLAYER_STATS_INCLUDE_LIVE_MATCHES:-true}"
      PLAYER_STATS_INCLUDE_UPCOMING_MATCHES: "${PLAYER_STATS_INCLUDE_UPCOMING_MATCHES:-false}"
      PLAYER_STATS_POLLING_INTERVAL_SECONDS: "${PLAYER_STATS_POLLING_INTERVAL_SECONDS:-30}"
      PLAYER_STATS_LIVE_COOLDOWN_SECONDS: "${PLAYER_STATS_LIVE_COOLDOWN_SECONDS:-30}"
    volumes:
      - scraper_data:/app/storage
    depends_on:
      - backend
      - redis
    networks:
      - victoryline-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
          pids: 512
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:5000/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  prerender:
    image: "${PRERENDER_IMAGE:-macubex/victoryline-prerender:v1.2.2}"
    container_name: victoryline-prerender
    restart: unless-stopped
    ports:
      - "${PRERENDER_PORT:-9100}:9100"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://backend:8099}"
      PRERENDER_OUT_DIR: /shared-html/prerender
    volumes:
      - prerender_html:/shared-html
    depends_on:
      - backend
    networks:
      - victoryline-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://localhost:9100/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: "${FRONTEND_IMAGE:-macubex/victoryline-frontend:v1.2.2}"
    container_name: victoryline-frontend
    restart: unless-stopped
    # No external port mapping - accessed via Caddy reverse proxy only
    expose:
      - "80"
    volumes:
      - prerender_html:/shared-html
    environment:
      API_URL: "${API_URL:-http://backend:8099}"
    entrypoint: ["/bin/sh", "-c", "rm -rf /usr/share/nginx/html/prerender && ln -sf /shared-html/prerender /usr/share/nginx/html/prerender && nginx -g 'daemon off;'"]
    depends_on:
      - backend
      - prerender
      - scraper
    networks:
      - victoryline-network
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:80 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    container_name: victoryline-proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Optional but recommended for Let's Encrypt notifications
      - ACME_AGREE=true
      - EMAIL=${LETSENCRYPT_EMAIL:-akshay.d.waghmare@gmail.com}
    volumes:
      # Use production Caddyfile for automatic HTTPS with Let's Encrypt
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - victoryline-network

networks:
  victoryline-network:
    driver: bridge

volumes:
  # mysql_data:  # Not needed with H2 embedded database
  #   driver: local
  backend_data:
    driver: local
  redis_data:
    driver: local
  scraper_data:
    driver: local
  prerender_html:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
