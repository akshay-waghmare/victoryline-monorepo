<!-- Matches List Page — compact list layout -->
<div class="matches-list">

  <!-- Page Header -->
  <div class="matches-list__header">
    <h1 class="matches-list__title">Cricket Matches</h1>
    <p class="matches-list__subtitle">Live scores, fixtures & results</p>
  </div>

  <!-- Controls row: tabs + search + refresh -->
  <div class="matches-list__controls">
    <app-tab-nav
      [tabs]="filterTabs"
      [activeTabId]="selectedStatus"
      (tabChange)="onTabChange($event)"
      class="matches-list__tab-nav"
    ></app-tab-nav>

    <div class="matches-list__actions">
      <div class="matches-list__search">
        <input
          type="text"
          class="matches-list__search-input"
          placeholder="Search team or venue..."
          [(ngModel)]="searchQuery"
          (input)="onSearchChange(searchQuery)"
          aria-label="Search matches"
        />
        <svg class="matches-list__search-icon" width="16" height="16" viewBox="0 0 20 20" fill="none">
          <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <button
        type="button"
        class="matches-list__refresh-btn"
        (click)="onRefresh()"
        [disabled]="isLoading"
        aria-label="Refresh matches"
        title="Refresh"
      >
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
          <path d="M1 4v6h6M19 16v-6h-6M2.51 9A8 8 0 0 1 17 7.5M17.49 11A8 8 0 0 1 3 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="matches-list__content" *ngIf="isLoading">
    <app-skeleton-card [count]="6"></app-skeleton-card>
  </div>

  <!-- Error State -->
  <div class="matches-list__error" *ngIf="hasError && !isLoading">
    <p class="matches-list__error-message">{{ errorMessage }}</p>
    <button type="button" class="matches-list__retry-btn" (click)="onRefresh()">
      Try Again
    </button>
  </div>

  <!-- Match list -->
  <div class="matches-list__content" *ngIf="!isLoading && !hasError">

    <!-- Empty state -->
    <div class="matches-list__empty" *ngIf="filteredMatches.length === 0">
      <p class="matches-list__empty-message">{{ getEmptyStateMessage() }}</p>
      <p class="matches-list__empty-hint">{{ getEmptyStateHint() }}</p>
    </div>

    <ng-container *ngIf="!isUpcomingGroupedView(); else groupedUpcomingMatches">
      <app-match-card
        *ngFor="let match of filteredMatches; trackBy: trackByMatchId"
        [match]="match"
        [enableAnimations]="true"
        (cardClick)="onMatchClick(match)"
        (detailsClick)="onDetailsClick(match)"
      ></app-match-card>
    </ng-container>

    <ng-template #groupedUpcomingMatches>
      <section class="matches-list__group" *ngFor="let group of upcomingMatchGroups">
        <header class="matches-list__group-header">
          <h2 class="matches-list__group-title">{{ group.label }}</h2>
        </header>
        <app-match-card
          *ngFor="let match of group.matches; trackBy: trackByMatchId"
          [match]="match"
          [enableAnimations]="true"
          (cardClick)="onMatchClick(match)"
          (detailsClick)="onDetailsClick(match)"
        ></app-match-card>
      </section>
    </ng-template>
  </div>
</div>
