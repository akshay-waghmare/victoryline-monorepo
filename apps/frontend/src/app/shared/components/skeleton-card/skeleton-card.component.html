<!-- Skeleton Card — matches new compact horizontal layout -->
<div class="skeleton-card"
     *ngFor="let index of skeletonArray"
     [attr.aria-busy]="true"
     [attr.aria-label]="'Loading match ' + (index + 1)">

  <!-- Header skeleton -->
  <div class="skeleton-card__header">
    <div class="skeleton-card__series skeleton-card__shimmer"></div>
    <div class="skeleton-card__status skeleton-card__shimmer"></div>
  </div>

  <!-- Teams row skeleton -->
  <div class="skeleton-card__teams">
    <div class="skeleton-card__team">
      <div class="skeleton-card__avatar skeleton-card__shimmer"></div>
      <div class="skeleton-card__team-name skeleton-card__shimmer"></div>
      <div class="skeleton-card__score skeleton-card__shimmer"></div>
    </div>
    <div class="skeleton-card__vs skeleton-card__shimmer"></div>
    <div class="skeleton-card__team">
      <div class="skeleton-card__score skeleton-card__shimmer"></div>
      <div class="skeleton-card__team-name skeleton-card__shimmer"></div>
      <div class="skeleton-card__avatar skeleton-card__shimmer"></div>
    </div>
  </div>

  <!-- Info bar skeleton -->
  <div class="skeleton-card__info">
    <div class="skeleton-card__info-item skeleton-card__shimmer"></div>
  </div>
</div>
