# Opt-in frontend hot-reload overlay.
# Keeps the SSR frontend on :8080 and adds Angular dev server on :4200.

services:
  frontend:
    image: node:12.22.12-alpine
    build: null
    working_dir: /app
    command: >-
      sh -c "if [ ! -x node_modules/.bin/ng ]; then npm ci --legacy-peer-deps --no-audit --prefer-offline; fi
      && npm run start:hot -- --port 4000 --disable-host-check --proxy-config proxy.docker-dev.conf.json"
    ports:
      - "4200:4000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NG_CLI_ANALYTICS: "false"
      API_URL: http://backend:8099
      BACKEND_URL: http://backend:8099
      SCRAPER_URL: http://scraper:5000
      MODEL_API_URL: http://host.docker.internal:8000
    volumes:
      - ./apps/frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    depends_on:
      - backend
      - scraper
    networks:
      - victoryline-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  frontend_dev_node_modules:

networks:
  victoryline-network:
    external: true
    name: victoryline-monorepo_victoryline-network
